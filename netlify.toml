# Configuración de despliegue en Netlify (en la RAÍZ del repo, que es donde
# Netlify la lee). El sitio React vive en web/.
# Con base="web", `command` y `publish` son relativos a esa carpeta.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# El sitio usa HashRouter, así que no necesita reglas de redirección SPA.
# El APK NO se sirve desde Netlify: vive como release en GitHub y el botón de
# descarga apunta a releases/latest/download/bodymetria.apk.
