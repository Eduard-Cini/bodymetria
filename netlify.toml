# Configuración de despliegue en Netlify (en la RAÍZ del repo, que es donde
# Netlify la lee). El sitio React vive en web/.
# Con base="web", `command` y `publish` son relativos a esa carpeta.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# El sitio usa HashRouter, así que no necesita reglas de redirección SPA.

# El APK se sirve con el tipo correcto y forzando descarga.
[[headers]]
  for = "/bodymetria.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=bodymetria.apk"
